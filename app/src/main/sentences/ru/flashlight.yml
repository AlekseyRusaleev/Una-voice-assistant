turn_on:
  - (включи|вруби|зажги|включить) (фонарик|фонарь|свет|подсветку)
  - (фонарик|фонарь) (включи|вруби|зажги)
  - включи (фонарик|фонарь) (на|в) (телефоне|камере)

turn_off:
  - (выключи|выруби|погаси|отключи|выключить) (фонарик|фонарь|свет|подсветку)
  - (фонарик|фонарь) (выключи|выруби|погаси|отключи)
  - выключи (фонарик|фонарь) (на|в) (телефоне|камере)
