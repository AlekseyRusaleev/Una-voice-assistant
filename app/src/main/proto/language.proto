syntax = "proto3";

option java_package = "org.stypox.dicio.settings.datastore";
option java_multiple_files = true;

// Una speaks Russian only. Values used by Dicio are reserved so that a settings file written by an
// older build still parses: an unknown value simply becomes LANGUAGE_SYSTEM.
enum Language {
  reserved 1 to 8, 10 to 15;

  LANGUAGE_SYSTEM = 0;
  LANGUAGE_RU = 9; // Russian
}
